<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" >
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav>
    <a href="./index.html">Home</a>
  </nav>
  <embed src="https://media1.tenor.com/m/w8kAoMlhgjQAAAAC/so-it-begins-raining.gif" width="148" height="160"/><br><br>
  <form>
<section class="1">
          <label for="1">1. Who's your favorite Hobbit?</label><br>
    			<input type="text" name="1" id="1"><br><br>
        </section>
<section class="2">
          <label for="amount">2. How many bites of lembas bread is enough to fill the stomach of a grown man?</label>
          <br>
          <input type="number" name="2" id="2"><br><br>
        </section>
<section class="3">
          <label for="3">3. Where do you land on this scale?</label><br>
          <span>Smeagol</span>
          <input type="range" name="3" id="3" value="3" min="1" max="5">
          <span>Gollum</span><br><br>
        </section>
<section class="4">
          <span>4. Who's NOT in the picture?</span>
          <br>
          <input type="checkbox" name="4" id="faramir" value="faramir">
          <label for="faramir">Faramir</label>
          <input type="checkbox" name="4" id="legolas" value="legolas">
          <label for="legolas">Legolas</label>
          <input type="checkbox" name="4" id="aragorn" value="aragorn">
          <label for="aragorn">Aragorn</label>
          <img src="https://upload.wikimedia.org/wikipedia/en/thumb/4/40/Fellowship.JPG/500px-Fellowship.JPG?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" /><br><br>
        </section>
<section class="5">
          <span>5. Does one simply walk into Mordor?</span>
          <br>
          <input type="radio" name="5" id="51" value="5">
          <label for="yes">Yes</label>
          <input type="radio" name="5" id="52" value="5">
          <label for="no">No</label><br><br>
        </section>
<section class="6">
          <label for="6">6. Who would you save?</label>
          <select name="6" id="6">
            <option value="-">-</option>
            <option value="theoden">Théoden</option>
            <option value="saruman">Saruman</option>
            <option value="boromir">Boromir</option>
          </select>
        </section><br><br>  
<section class="7">
          <label for="7">7. Who would you NOT save?</label>
          <input list="7s" id="7" name="7">
          <datalist id="7s">
            <option value="Pippin"></option>
          </datalist>
        </section>
      <br><br>
<section class="8">
          <label for="extra">8. Anything else you want to add?</label>
          <br>
          <textarea id="extra" name="extra" rows="3" cols="40"></textarea>
        </section>
        <hr>
<section class="submission">
          <input type="submit" value="Submit">
      </section>
  </form>
</body>
</html>
